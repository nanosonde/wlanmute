# git-cliff configuration: generates CHANGELOG.md from Conventional Commits.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html),
and entries are generated from [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**BREAKING**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
# Link references; git-cliff appends the final newline itself.
footer = """
{%- for release in releases -%}
{%- if release.version -%}
{%- if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/nanosonde/wlanmute/compare/{{ release.previous.version }}...{{ release.version }}
{%- else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/nanosonde/wlanmute/releases/tag/{{ release.version }}
{%- endif -%}
{%- else -%}
[Unreleased]: https://github.com/nanosonde/wlanmute/compare/{{ release.previous.version }}...HEAD
{%- endif -%}
{%- if not loop.last %}{{ "\n" }}{% endif -%}
{%- endfor -%}"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^build", group = "<!-- 5 -->Build" },
  { message = "^ci", group = "<!-- 6 -->Continuous integration" },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
]
